name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build bilingual pages and validate source
        run: |
          node scripts/build-site.mjs
          node scripts/validate-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          paths=(
            ""
            "dio-viditelnost/"
            "dio-ai-data/"
            "odi/"
            "partnerstvi/"
            "dukazy/"
            "autor/"
            "en/"
            "en/ai-visibility/"
            "en/entity-resolution/"
            "en/ontology-of-digital-identity/"
            "en/partnerships/"
            "en/evidence/"
            "en/author/"
            "assets/site.css"
            "assets/site.js"
            "assets/dio-odi-social-v1.png"
            "favicon.svg"
            "sitemap.xml"
            "llms.txt"
            "llms-full.txt"
            "humans.txt"
            "NOTICE.txt"
          )

          for path in "${paths[@]}"; do
            status="$(curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${SITE_URL}${path}")"
            test "${status}" = "200"
          done

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "${SITE_URL}llms.txt" \
            | grep --fixed-strings "DIO/ODI — authorial concept by Daniel Beránek"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "${SITE_URL}en/" \
            | grep --fixed-strings "DIO/ODI: Author-Led IP – AI Visibility &amp; Entity Resolution"
